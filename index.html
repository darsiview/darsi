<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2662a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>عارض الدروس — جوالي</title>
<style>
  :root{--ac:#f2662a;--bg:#fff8f0;--card:#fff;--tx:#222;--mu:#777;--ok:#2fb344;--bad:#e5484d;--line:#eee3d6}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.7;min-height:100vh}
  header{background:var(--ac);color:#fff;padding:14px 16px;font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
  main{max-width:480px;margin:0 auto;padding:16px}
  .card{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 4px 18px rgba(0,0,0,.06);margin-bottom:14px}
  h1{font-size:20px;margin:0 0 6px} h2{font-size:17px;margin:0 0 8px}
  p{margin:0 0 10px}.mu{color:var(--mu);font-size:14px}
  label{display:block;font-size:14px;color:#555;margin:10px 0 4px}
  input{width:100%;height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;font-family:inherit;direction:ltr;text-align:left}
  input:focus{outline:none;border-color:var(--ac)}
  button{width:100%;height:50px;border:0;border-radius:12px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:12px;background:var(--ac);color:#fff}
  button.sec{background:#f1eee9;color:#333}button.bad{background:#fff;color:var(--bad);border:1.5px solid #f3c2c3}
  button.link{background:none;color:var(--ac);height:auto;margin-top:8px;font-weight:600}
  button:disabled{opacity:.55}
  .err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
  .dev{font-size:22px;font-weight:700;text-align:center;background:#fff3ec;border-radius:12px;padding:14px;margin:10px 0}
  .big{font-size:56px;text-align:center;line-height:1.2}
  .row{display:flex;gap:10px}.row button{flex:1}
  .dv{border-top:1px solid var(--line);padding:12px 0}.dv:first-child{border-top:0}
  .dv b{display:block}.dv small{color:var(--mu)}
  .dv .row button{height:40px;font-size:14px;margin-top:8px}
  .me{display:flex;justify-content:space-between;align-items:center;gap:10px}
</style>
</head>
<body>
<header>📱 <span>عارض الدروس — جوالي</span></header>
<main id="app"></main>
<script>
// صفحة الجوال: الموافقة على الدخول بالباركود، وإدارة «أجهزتي». لا تحفظ كلمة المرور أبداً.
const CFG = { apiKey: 'AIzaSyAhVv1QkcwpYkdA8HMbeaSWBWuJm7_vxmQ', projectId: 'darsi-view' };
const AUTH = window.LP_AUTH || 'https://identitytoolkit.googleapis.com/v1';
const TOKEN = window.LP_TOKEN || 'https://securetoken.googleapis.com/v1';
const FS = (window.LP_FS || 'https://firestore.googleapis.com/v1') + `/projects/${CFG.projectId}/databases/(default)/documents`;
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const app = $('#app');
const ERR = { INVALID_LOGIN_CREDENTIALS: 'البريد أو كلمة المرور غير صحيحة.', INVALID_PASSWORD: 'البريد أو كلمة المرور غير صحيحة.', EMAIL_NOT_FOUND: 'البريد أو كلمة المرور غير صحيحة.',
  TOO_MANY_ATTEMPTS_TRY_LATER: 'محاولات كثيرة. انتظري قليلاً.', USER_DISABLED: 'هذا الحساب موقوف.', net: 'لا يوجد اتصال بالإنترنت.' };

// ---------- الجلسة على الجوال ----------
let S = null; try { S = JSON.parse(localStorage.getItem('lpPhone') || 'null'); } catch {}
const saveS = () => { try { S ? localStorage.setItem('lpPhone', JSON.stringify(S)) : localStorage.removeItem('lpPhone'); } catch {} };
async function post(url, body, form) {
  let r; try { r = await fetch(url, { method: 'POST', headers: { 'Content-Type': form ? 'application/x-www-form-urlencoded' : 'application/json' }, body: form ? new URLSearchParams(body) : JSON.stringify(body) }); }
  catch { throw new Error('net'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(String((j.error && j.error.message) || r.status).split(/[ :]/)[0]);
  return j;
}
async function idToken() {
  if (S.idToken && Date.now() < S.exp) return S.idToken;
  const j = await post(`${TOKEN}/token?key=${CFG.apiKey}`, { grant_type: 'refresh_token', refresh_token: S.rt }, true);
  S.idToken = j.id_token; S.rt = j.refresh_token; S.exp = Date.now() + (+j.expires_in - 120) * 1000; saveS();
  return S.idToken;
}
async function fsReq(method, path, body) {
  let r; try { r = await fetch(`${FS}/${path}`, { method, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + await idToken() }, body: body ? JSON.stringify(body) : undefined }); }
  catch { throw new Error('net'); }
  if (r.status === 404) return null;
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((j.error && j.error.status) || 'fail');
  return j;
}
const b64u = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0));
// مفتاح فتح بيانات الجهاز (lk): يُنشأ مرة واحدة ويُحفظ في ملف المعلمة بالسحابة
async function getLk() {
  const d = await fsReq('GET', `users/${S.uid}`);
  const lk = d && d.fields && d.fields.lk && d.fields.lk.stringValue;
  if (lk) return lk;
  const n = b64u(crypto.getRandomValues(new Uint8Array(32)));
  await fsReq('PATCH', `users/${S.uid}?updateMask.fieldPaths=lk`, { fields: { lk: { stringValue: n } } });
  return n;
}

// ---------- مفتاح خزنة الحسابات: يُفتح على الجوال بكلمة المرور، ويُرسل مشفّراً مع الموافقة ----------
const b64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function vaultKeyDoc() { const d = await fsReq('GET', `users/${S.uid}/vault/key`); return d && d.fields; }
async function unwrapVk(f, password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(f.s.stringValue), iterations: +(f.it && f.it.integerValue || 310000), hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(f.iv.stringValue) }, key, b64(f.d.stringValue));
  return JSON.parse(new TextDecoder().decode(pt)).k;
}
async function tryVault(password) {
  try { const f = await vaultKeyDoc(); if (f) { S.vk = await unwrapVk(f, password); saveS(); } } catch {}
}

// ---------- الشاشات ----------
const Q = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
function loginView(note) {
  app.innerHTML = `<div class="card"><h1>تسجيل الدخول</h1>
    <p class="mu">${note || 'ادخلي بحسابكِ السحابي في عارض الدروس. تحتاجين ذلك مرة واحدة فقط على هذا الجوال.'}</p>
    <label>البريد الإلكتروني</label><input id="em" type="email" autocomplete="username">
    <label>كلمة المرور</label><input id="pw" type="password" autocomplete="current-password">
    <div class="err" id="er"></div>
    <button id="go">دخول</button><button class="link" id="fg">نسيت كلمة المرور؟</button></div>`;
  $('#go').onclick = async () => {
    const b = $('#go'); b.disabled = true; b.textContent = 'جارٍ الدخول…'; $('#er').textContent = '';
    try {
      const j = await post(`${AUTH}/accounts:signInWithPassword?key=${CFG.apiKey}`, { email: $('#em').value.trim(), password: $('#pw').value, returnSecureToken: true });
      S = { uid: j.localId, email: j.email, name: j.displayName || '', rt: j.refreshToken, idToken: j.idToken, exp: Date.now() + (+j.expiresIn - 120) * 1000 }; saveS();
      await tryVault($('#pw').value);
      route();
    } catch (e) { $('#er').textContent = ERR[e.message] || 'تعذّر الدخول. حاولي مرة أخرى.'; b.disabled = false; b.textContent = 'دخول'; }
  };
  $('#fg').onclick = async () => {
    const em = $('#em').value.trim(); if (!em) { $('#er').textContent = 'اكتبي بريدكِ أولاً.'; return; }
    try { await post(`${AUTH}/accounts:sendOobCode?key=${CFG.apiKey}`, { requestType: 'PASSWORD_RESET', email: em }); } catch {}
    $('#er').style.color = 'var(--ok)'; $('#er').textContent = 'إذا كان البريد مسجّلاً وصلكِ رابط لتغيير كلمة المرور.';
  };
}
function approveView() {
  const exp = +Q.t || 0;
  if (!Q.s || !Q.k || (exp && Date.now() > exp)) { history.replaceState(null, '', location.pathname); return homeView('انتهت صلاحية الرمز. اضغطي «رمز جديد» في الجهاز وامسحيه مرة أخرى.'); }
  app.innerHTML = `<div class="card"><h1>الدخول على جهاز</h1>
    <div class="dev">💻 ${esc(Q.n || 'جهاز')}</div>
    <p>هل تريدين الدخول بحسابكِ <b dir="ltr">${esc(S.email)}</b> على هذا الجهاز؟</p>
    <p class="mu">⚠ وافقي فقط إذا كنتِ أمام هذا الجهاز الآن وأنتِ من طلب الرمز.</p>
    <div id="vk"></div>
    <div class="err" id="er"></div>
    <button id="yes">✓ نعم، أدخلني</button><button class="sec" id="no">لا</button></div>`;
  $('#no').onclick = () => { history.replaceState(null, '', location.pathname); homeView(); };
  // خزنة الحسابات موجودة ولم تُفتح على هذا الجوال بعد: كلمة المرور مرة واحدة (اختياري)
  if (!S.vk) vaultKeyDoc().then(f => { if (f && !S.vk) $('#vk').innerHTML = `<label>🔐 لتنتقل دخولاتكِ إلى مايكروسوفت وقوقل: كلمة المرور (مرة واحدة فقط، اختياري)</label><input id="vpw" type="password" autocomplete="current-password">`; }).catch(() => {});
  $('#yes').onclick = async () => {
    const b = $('#yes'); b.disabled = true; b.textContent = 'جارٍ الإرسال…';
    try {
      await idToken();
      if (!S.vk && $('#vpw') && $('#vpw').value) await tryVault($('#vpw').value);
      const lk = await getLk();
      const key = await crypto.subtle.importKey('raw', unb64u(Q.k), 'AES-GCM', false, ['encrypt']);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const payload = new TextEncoder().encode(JSON.stringify({ rt: S.rt, lk, uid: S.uid, email: S.email, name: S.name, vk: S.vk || null }));
      const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, payload);
      const r = await fsReq('PATCH', `qr/${encodeURIComponent(Q.s)}`, { fields: { uid: { stringValue: S.uid }, iv: { stringValue: b64u(iv) }, p: { stringValue: b64u(ct) }, exp: { integerValue: String(exp || Date.now() + 120000) } } });
      if (!r) throw new Error('fail');
      history.replaceState(null, '', location.pathname);
      app.innerHTML = `<div class="card" style="text-align:center"><div class="big">✅</div><h1>تم</h1><p>ارجعي إلى الجهاز، سيفتح حسابكِ خلال ثوانٍ.</p><button class="sec" id="h">أجهزتي</button></div>`;
      $('#h').onclick = () => homeView();
    } catch (e) {
      $('#er').textContent = e.message === 'net' ? ERR.net : e.message === 'PERMISSION_DENIED' ? 'استُخدم هذا الرمز من قبل. اطلبي رمزاً جديداً من الجهاز.' : 'تعذّر الإرسال. حاولي مرة أخرى.';
      b.disabled = false; b.textContent = '✓ نعم، أدخلني';
    }
  };
}
async function homeView(note) {
  app.innerHTML = `<div class="card"><div class="me"><div><b>${esc(S.name || 'حسابي')}</b><br><small class="mu" dir="ltr">${esc(S.email)}</small></div><button class="sec" id="out" style="width:auto;padding:0 14px;height:40px;margin:0">خروج</button></div></div>
    ${note ? `<div class="card"><p class="err" style="margin:0">${esc(note)}</p></div>` : ''}
    <div class="card"><h2>💻 أجهزتي</h2><p class="mu">الأجهزة التي دخلتِ عليها. تستطيعين إخراج أي جهاز نسيتِ الخروج منه.</p><div id="dl" class="mu">جارٍ التحميل…</div></div>
    <div class="card"><h2>📷 للدخول على جهاز</h2><p class="mu">في البرنامج اضغطي «📱 الدخول بالجوال»، ثم امسحي الرمز بكاميرا هذا الجوال.</p>
      <p class="mu">💡 أضيفي هذه الصفحة إلى الشاشة الرئيسية: من زر المشاركة ← «إضافة إلى الشاشة الرئيسية».</p></div>`;
  $('#out').onclick = () => { S = null; saveS(); loginView('خرجتِ من حسابكِ على هذا الجوال.'); };
  try {
    const j = await fsReq('GET', `users/${S.uid}/devices?pageSize=50`);
    const list = ((j && j.documents) || []).map(d => ({ id: d.name.split('/').pop(), f: d.fields || {} }))
      .sort((a, b) => String(b.f.lastSeen && b.f.lastSeen.timestampValue).localeCompare(String(a.f.lastSeen && a.f.lastSeen.timestampValue)));
    const fmt = (t) => { try { return new Date(t).toLocaleString('ar-SA', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }); } catch { return ''; } };
    $('#dl').innerHTML = !list.length ? 'لا توجد أجهزة بعد.' : list.map(d => `<div class="dv"><b>💻 ${esc(d.f.name && d.f.name.stringValue || 'جهاز')}</b>
      <small>آخر استخدام: ${esc(fmt(d.f.lastSeen && d.f.lastSeen.timestampValue))}${d.f.personal && d.f.personal.booleanValue ? ' · جهازي الشخصي' : ''}</small>
      ${d.f.revoke ? `<small style="color:var(--bad)"> · سيخرج عند اتصاله بالإنترنت</small>` : `<div class="row"><button class="sec" data-out="${esc(d.id)}">إخراج</button><button class="bad" data-wipe="${esc(d.id)}">إخراج ومسح بياناتي</button></div>`}</div>`).join('');
    const act = async (id, how, b) => { b.disabled = true; await fsReq('PATCH', `users/${S.uid}/devices/${encodeURIComponent(id)}?updateMask.fieldPaths=revoke`, { fields: { revoke: { stringValue: how } } }); homeView(); };
    app.querySelectorAll('[data-out]').forEach(b => b.onclick = () => act(b.dataset.out, 'out', b));
    app.querySelectorAll('[data-wipe]').forEach(b => b.onclick = () => act(b.dataset.wipe, 'wipe', b));
  } catch (e) {
    if (e.message === 'INVALID_REFRESH_TOKEN' || e.message === 'TOKEN_EXPIRED' || e.message === 'USER_NOT_FOUND') { S = null; saveS(); return loginView('انتهت الجلسة. سجّلي الدخول مرة أخرى.'); }
    $('#dl').textContent = e.message === 'net' ? ERR.net : 'تعذّر تحميل الأجهزة.';
  }
}
function route() {
  if (!S) return loginView(Q.s ? 'سجّلي الدخول للموافقة على فتح حسابكِ في الجهاز. (مرة واحدة فقط على هذا الجوال)' : '');
  if (Q.s) return approveView();
  homeView();
}
window.addEventListener('hashchange', () => { Object.keys(Q).forEach(k => delete Q[k]); Object.assign(Q, Object.fromEntries(new URLSearchParams(location.hash.slice(1)))); route(); });
route();
</script>
</body>
</html>
